<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#000000"/>

  <!-- Subtle inner ring -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Shopping bag -->
  <g transform="translate(256 266)">
    <!-- bag body -->
    <path d="M -108 -40
             L -128 132
             C -130 148 -118 162 -102 162
             L 102 162
             C 118 162 130 148 128 132
             L 108 -40 Z"
          fill="#FFFFFF"/>

    <!-- bag handle -->
    <path d="M -56 -40 L -56 -78 C -56 -112 -30 -140 0 -140 C 30 -140 56 -112 56 -78 L 56 -40"
          fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>

    <!-- handle cutout (shows background through the loop) -->
    <path d="M -56 -40 L -56 -78 C -56 -112 -30 -140 0 -140 C 30 -140 56 -112 56 -78 L 56 -40"
          fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round"
          opacity="0" />

    <!-- price tag / check mark on bag -->
    <path d="M -34 30 L -10 56 L 40 -6"
          fill="none" stroke="#000000" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
