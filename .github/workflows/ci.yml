name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false

      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

      GROQ_API_KEY: testing

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

      MAIL_MAILER: array
      FILESYSTEM_DISK: local

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate Composer lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: https://api-ai-ecommerce-laravel.cloudafk.xyz/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 10028
          script: |
            echo "===== REMOTE SSH DIAGNOSTIC ====="
            echo "USER=$(whoami)"
            echo "UID=$(id -u)"
            echo "GROUPS=$(id -Gn)"
            echo "HOME=$HOME"
            echo "TTY=$(tty || true)"
            echo "SUDO=$(command -v sudo || true)"
            echo "SYSTEMCTL=$(command -v systemctl || true)"
            echo "===== SUDO LIST ====="
            sudo -n -l || true
            echo "===== API SUDO TEST ====="
            sudo -n systemctl restart ai-ecommerce-api.service
            echo "restart_exit=$?"
            echo "===== API STATUS ====="
            sudo -n systemctl is-active ai-ecommerce-api.service
            echo "status_exit=$?"
            echo "===== END DIAGNOSTIC ====="

            cd /home/administrator/projects/ai-ecommerce-platform
            ./scripts/deploy.sh
